name: Scheduled Plaid sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Plaid sync
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: |
          set -e

          curl --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "${API_BASE_URL}/internal/sync/run" \
            --header "x-internal-secret: ${INTERNAL_SECRET}" \
            --header "Content-Type: application/json" \
            --max-time 90
